name: TELos CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e "const a=require(process.env.RUNNER_TEMP+'/npm-audit.json'); Object.entries(a.vulnerabilities||{}).forEach(([n,v])=>console.log(n+': '+v.severity+'; fix='+JSON.stringify(v.fixAvailable)))"
      - run: npm run typecheck
      - run: npm run build